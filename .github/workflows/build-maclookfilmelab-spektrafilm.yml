name: Build Look Film Lab

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to build
        required: true
        default: all
        type: choice
        options:
          - all
          - cine
          - photo
          - scan
      target:
        description: Build target
        required: true
        default: both
        type: choice
        options:
          - both
          - macos
          - windows
      description:
        description: Optional release description
        required: false
        type: string
        default: ''
      prerelease:
        description: Mark release as prerelease
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  SOURCE_REPOSITORY: ciqueira/LookFilmLab
  SOURCE_REF: spektra-lookfilmlab
  RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      products: ${{ steps.matrix.outputs.products }}
      target: ${{ steps.matrix.outputs.target }}
      release_tag: ${{ steps.matrix.outputs.release_tag }}
    steps:
      - name: Determine Products
        id: matrix
        shell: bash
        env:
          INPUT_PRODUCT: ${{ github.event.inputs.product }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail

          PRODUCTS='[]'

          add_product() {
            local key="$1"
            local name="$2"
            local target="$3"
            local bundle="$4"
            local version_file="$5"
            local version

            version="0.0.0"
            PRODUCTS=$(jq -c \
              --arg key "$key" \
              --arg name "$name" \
              --arg target "$target" \
              --arg bundle "$bundle" \
              --arg version_file "$version_file" \
              --arg version "$version" \
              '. + [{
                key: $key,
                name: $name,
                target: $target,
                bundle: $bundle,
                version_file: $version_file,
                version: $version
              }]' <<< "$PRODUCTS")
          }

          add_known_product() {
            case "$1" in
              cine)
                add_product cine "Look Film Lab CINE" MCLookFilmLabCINE MCLookFilmLabCINE.ofx.bundle VERSION_CINE
                ;;
              photo)
                add_product photo "Look Film Lab PHOTO" MCLookFilmLabPHOTO MCLookFilmLabPHOTO.ofx.bundle VERSION_PHOTO
                ;;
              scan)
                add_product scan "Look Film Lab SCAN" MCLookFilmLabSCAN MCLookFilmLabSCAN.ofx.bundle VERSION_SCAN
                ;;
              *)
                echo "Unknown product: $1" >&2
                exit 1
                ;;
            esac
          }

          case "${INPUT_PRODUCT:-all}" in
            all)
              add_known_product cine
              add_known_product photo
              add_known_product scan
              ;;
            cine|photo|scan)
              add_known_product "$INPUT_PRODUCT"
              ;;
            *)
              echo "Invalid product input: ${INPUT_PRODUCT:-}" >&2
              exit 1
              ;;
          esac

          echo "products=$PRODUCTS" >> "$GITHUB_OUTPUT"
          echo "target=${INPUT_TARGET:-both}" >> "$GITHUB_OUTPUT"
          echo "release_tag=lookfilmlab-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS (${{ matrix.product.name }})
    needs: prepare
    if: |
      needs.prepare.outputs.products != '[]' &&
      (needs.prepare.outputs.target == 'both' || needs.prepare.outputs.target == 'macos')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJson(needs.prepare.outputs.products) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - name: Ensure OpenFX SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f source/third_party/openfx/include/ofxImageEffect.h ]; then
            rm -rf source/third_party/openfx
            git clone --depth 1 --branch OFX_Release_1.5.1 \
              https://github.com/AcademySoftwareFoundation/openfx.git \
              source/third_party/openfx
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: python -m pip install numpy scipy colour-science

      - name: Read Product Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < "source/${{ matrix.product.version_file }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -S source -B build-${{ matrix.product.key }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPEKTRAFILM_PRO_BUILD_MODE=PRODUCTION \
            -DSPEKTRAFILM_PRO_CALIBRATION_FILE="${GITHUB_WORKSPACE}/source/calibration/active_production_calibration.lookfilmlab.json"

      - name: Build
        run: cmake --build build-${{ matrix.product.key }} --target ${{ matrix.product.target }} --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          package_name="${{ matrix.product.target }}"
          package_name="${package_name#MC}"
          artifact="artifacts/${package_name}-${{ steps.version.outputs.version }}-macOS.zip"
          bundle="${{ matrix.product.bundle }}"
          stage="package-${{ matrix.product.key }}-macos"

          rm -rf "$stage"
          mkdir -p artifacts "$stage"
          ditto "build-${{ matrix.product.key }}/${bundle}" "$stage/${bundle}"

          (
            cd "$stage"
            zip -qry "../${artifact}" "$bundle"
          )

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product.target }}-macOS
          path: artifacts/*.zip
          retention-days: 7

  build-windows:
    name: Build Windows (${{ matrix.product.name }})
    needs: prepare
    if: |
      needs.prepare.outputs.products != '[]' &&
      (needs.prepare.outputs.target == 'both' || needs.prepare.outputs.target == 'windows')
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJson(needs.prepare.outputs.products) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - name: Ensure OpenFX SDK
        shell: pwsh
        run: |
          if (!(Test-Path 'source/third_party/openfx/include/ofxImageEffect.h')) {
            if (Test-Path 'source/third_party/openfx') {
              Remove-Item 'source/third_party/openfx' -Recurse -Force
            }
            git clone --depth 1 --branch OFX_Release_1.5.1 `
              https://github.com/AcademySoftwareFoundation/openfx.git `
              source/third_party/openfx
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        shell: pwsh
        run: python -m pip install numpy scipy colour-science

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress

          $sdkRoots = @('C:\VulkanSDK', "$env:ProgramFiles\VulkanSDK") |
            Where-Object { Test-Path $_ }
          $sdk = $sdkRoots |
            ForEach-Object { Get-ChildItem $_ -Directory } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (!$sdk) {
            Write-Error 'Vulkan SDK was not found under C:\VulkanSDK or Program Files.'
          }

          $bin = Join-Path $sdk.FullName 'Bin'
          if (!(Test-Path (Join-Path $bin 'glslc.exe'))) {
            Write-Error "glslc.exe was not found in $bin."
          }

          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          "$bin" >> $env:GITHUB_PATH
          & (Join-Path $bin 'glslc.exe') --version

      - name: Read Product Version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content "source/${{ matrix.product.version_file }}" -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Configure
        shell: pwsh
        run: |
          cmake -S source -B "build-${{ matrix.product.key }}" `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DSPEKTRAFILM_PRO_BUILD_MODE=PRODUCTION `
            -DSPEKTRAFILM_PRO_CALIBRATION_FILE="$env:GITHUB_WORKSPACE/source/calibration/active_production_calibration.lookfilmlab.json"

      - name: Build
        shell: pwsh
        run: cmake --build "build-${{ matrix.product.key }}" --target "${{ matrix.product.target }}" --config Release --parallel 4

      - name: Package
        shell: pwsh
        run: |
          $packageName = "${{ matrix.product.target }}" -replace '^MC', ''
          $artifact = "artifacts/$packageName-${{ steps.version.outputs.version }}-Windows.zip"
          $bundle = "${{ matrix.product.bundle }}"
          $stage = "package-${{ matrix.product.key }}-windows"

          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build-${{ matrix.product.key }}/$bundle" "$stage/$bundle" -Recurse -Force

          Push-Location $stage
          Compress-Archive -Path $bundle -DestinationPath "../$artifact" -Force
          Pop-Location

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product.target }}-Windows
          path: artifacts/*.zip
          retention-days: 7

  release:
    name: Publish Release
    needs:
      - prepare
      - build-macos
      - build-windows
    if: |
      always() &&
      needs.prepare.outputs.products != '[]' &&
      !cancelled() &&
      needs.build-macos.result != 'failure' &&
      needs.build-windows.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to LookFilmLab
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LOOKFILMLAB_RELEASE_TOKEN || github.token }}
          RELEASE_TOKEN_CONFIGURED: ${{ secrets.LOOKFILMLAB_RELEASE_TOKEN != '' }}
          RELEASE_REPOSITORY: ${{ env.RELEASE_REPOSITORY }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_DESCRIPTION: ${{ github.event.inputs.description }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing release token. Configure LOOKFILMLAB_RELEASE_TOKEN or allow GITHUB_TOKEN contents:write." >&2
            exit 1
          fi

          if [ "${RELEASE_REPOSITORY}" != "${CURRENT_REPOSITORY}" ] && [ "${RELEASE_TOKEN_CONFIGURED}" != "true" ]; then
            echo "Publishing to ${RELEASE_REPOSITORY} from ${CURRENT_REPOSITORY} may require LOOKFILMLAB_RELEASE_TOKEN with cross-repository release permissions." >&2
          fi

          prerelease_flag=""
          if [ "${PRERELEASE}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          notes="${RELEASE_DESCRIPTION:-Automated Look Film Lab build.}"

          gh release create "${RELEASE_TAG}" release-assets/*.zip \
            --repo "${RELEASE_REPOSITORY}" \
            --title "Look Film Lab Pack" \
            --notes "${notes}" \
            ${prerelease_flag}
